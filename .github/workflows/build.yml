name: Build Android

# 실행 방법
#  - GitHub 저장소 → Actions 탭 → "Build Android" → Run workflow  (수동)
#  - 또는 git tag v1.0.0 && git push --tags                        (자동)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  SF_VERSION: sf_17.1
  SF_ASSET: stockfish-android-armv8.tar

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v3

      - name: SDK 플랫폼 설치 (Android 16)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # 스톡피시 공식 안드로이드 빌드를 받아 네이티브 라이브러리로 심는다.
      # (앱 안에서 실행하려면 jniLibs 에 .so 이름으로 들어가 있어야 한다)
      - name: 스톡피시 엔진 내려받기
        run: |
          set -e
          URL="https://github.com/official-stockfish/Stockfish/releases/download/${SF_VERSION}/${SF_ASSET}"
          echo "다운로드: $URL"
          curl -fL --retry 3 "$URL" -o sf.tar
          mkdir -p sfx && tar xf sf.tar -C sfx
          BIN=$(find sfx -type f -name 'stockfish-android-armv8*' | head -1)
          test -n "$BIN" || { echo "엔진 바이너리를 찾지 못했습니다"; find sfx -type f | head; exit 1; }
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$BIN" android/app/src/main/jniLibs/arm64-v8a/libstockfish.so
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libstockfish.so
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          # GPL 고지: 라이선스 원문을 앱 자산에 함께 넣는다
          LIC=$(find sfx -iname 'Copying.txt' | head -1)
          if [ -n "$LIC" ]; then mkdir -p www/assets && cp "$LIC" www/assets/stockfish-COPYING.txt; fi

      - name: 업로드 키 복호화
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/upload.jks

      - name: AAB 빌드 (Play 업로드용)
        working-directory: android
        env:
          KEYSTORE_PATH:     ${{ env.KEYSTORE_B64 != '' && format('{0}/upload.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: APK 빌드 (폰에 직접 설치해서 테스트용)
        working-directory: android
        env:
          KEYSTORE_PATH:     ${{ env.KEYSTORE_B64 != '' && format('{0}/upload.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: 결과물 확인
        run: |
          echo "### 빌드 결과" >> $GITHUB_STEP_SUMMARY
          find android/app/build/outputs -type f \( -name '*.aab' -o -name '*.apk' \) \
            -printf '%f  %s bytes\n' | tee -a $GITHUB_STEP_SUMMARY

      - name: AAB 업로드
        uses: actions/upload-artifact@v4
        with:
          name: aab-play-upload
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: apk-test
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
